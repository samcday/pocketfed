# Liveboot early-module ordering for the Qualcomm APQ8016/MSM8916 DragonBoard
# 410c. Kept independent of installed-image dracut policy so a trial does not
# alter deployment recipes. Module names are verified against the msm8916
# kernel tree's Kbuild object names; only SoC-common msm8916 drivers belong
# here. Do not copy the sdm670 RPMh/TCPM list: that SoC uses a different
# RPM transport, clock family and USB controller.
hostonly="yes"
hostonly_mode="strict"
hostonly_cmdline="no"
hostonly_default_device="no"

# Load DT-only suppliers before their consumers; modules.dep cannot express
# those relationships, and a probe that times out is not retried reliably.
# Order: firmware, the TCSR hwspinlock provider that SMEM needs for its
# `hwlocks = <&tcsr_mutex 3>`, the APCS IPC mailbox that the RPM SMD edge
# needs for its `mboxes = <&apcs 0>`, then SMEM and the SMD RPM transport that
# supplies clocks and regulators, the SMD RPM clock driver
# ("qcom,rpmcc-msm8916") feeding the builtin GCC clock controller with the XO,
# the TLMM pin controller behind every board GPIO, the interconnect NOCs, the
# SPMI PMIC chain, and finally the ULPI HS PHY feeding the ChipIdea USB
# controller whose VBUS/ID detection comes from the GPIO extcon. Without the
# hwspinlock provider, builtin SMEM never becomes available, so qcom_smd,
# rpm-proc, smd-rpm and everything downstream defer and USB never comes up.
# msm8916 RPM clocks are clk_smd_rpm; the legacy clk_rpm driver does not
# support this SoC.
force_drivers+=" \
    qcom_scm \
    qcom_hwspinlock \
    qcom_apcs_ipc_mailbox \
    smem \
    qcom_smd \
    rpm_proc \
    smd_rpm \
    clk_smd_rpm \
    gcc_msm8916 \
    pinctrl_msm \
    pinctrl_msm8916 \
    qnoc_msm8916 \
    spmi_pmic_arb \
    qcom_spmi_pmic \
    qcom_spmi_regulator \
    qcom_smd_regulator \
    rtc_pm8xxx \
    ulpi \
    phy_qcom_usb_hs \
    ci_hdrc \
    ci_hdrc_msm \
    extcon_usb_gpio \
"

add_drivers+=" \
    gpio_keys \
"

filesystems+=" ext4 overlay "
omit_dracutmodules+=" drm qemu nvdimm fido2 pkcs11 lunmask resume "
