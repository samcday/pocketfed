name: Base

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: systemd/mkosi@ecf7f5702bb2052b7a69cab3fe7d37bc3b9ad77b # v27.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mkosi.pkgcache
          key: ${{ runner.os }}-${{ runner.arch }}-mkosi-packages-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mkosi-packages-

      - name: Build and check base directory
        run: sudo mkosi build

      - name: Make package cache readable
        run: sudo chmod -R a+rX mkosi.pkgcache
