# Always-present silent sink so audio clients never wait forever for a sink
# that cannot run.
#
# feedbackd ships wireplumber.conf.d/media-role-nodes.conf, which creates six
# role loopback sinks (Multimedia, Notification, Phone, Alarm, Ringtone, Alert)
# whether or not a sound card exists. With no hardware sink WirePlumber 0.5
# links the loopback outputs into each other, the Alert loopback's cork action
# wins, and every role stream stays corked and unconfigured. Clients that block
# until their stream runs, such as openal-soft's PipeWire backend, hang in
# alcCreateContext. A card that appears later does not clear the stale cork.
# Devices whose card lives behind a remoteproc (the Samsung A5's modem QDSP6)
# hit both cases.
#
# The lowest session priority keeps this sink below every ALSA and Bluetooth
# sink, so it is the default only while nothing else exists, and the loopbacks
# follow the default when a real sink appears.
context.objects = [
  { factory = adapter
    args = {
      factory.name            = support.null-audio-sink
      node.name               = "pocketfed-dummy-output"
      node.description        = "Dummy Output (no audio hardware)"
      media.class             = "Audio/Sink"
      audio.position          = "FL,FR"
      audio.rate              = 48000
      monitor.channel-volumes = true
      node.virtual            = true
      priority.session        = 1
    }
  }
]
