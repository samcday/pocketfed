# Phrog's greeter session has HOME=/var/lib/greetd. Dconf cannot create that
# top-level state directory as the unprivileged greetd user; applications which
# write settings can otherwise enter a tight retry loop at the login screen.
d /var/lib/greetd 0700 greetd greetd -
d /var/lib/greetd/.config 0700 greetd greetd -
d /var/lib/greetd/.config/dconf 0700 greetd greetd -
