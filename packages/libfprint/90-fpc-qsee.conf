[Unit]
# Device-local firmware and cmnlib64 ordering are supplied by the Sargo trial
# configuration on the application loader, before fprintd can open the sensor.
Requires=qsee-supplicant.service qsee-app-loader@fpctzappfingerprint.service pocketfed-keymaster-startup.service
After=qsee-supplicant.service qsee-app-loader@fpctzappfingerprint.service pocketfed-keymaster-startup.service

[Service]
# Linux reserves tee0..tee15 for unprivileged clients. Do not grant char-tee,
# which would also admit the privileged app-loader/listener devices.
DeviceAllow=/dev/fpc1020 rw
DeviceAllow=/dev/tee0 rw
DeviceAllow=/dev/tee1 rw
DeviceAllow=/dev/tee2 rw
DeviceAllow=/dev/tee3 rw
DeviceAllow=/dev/tee4 rw
DeviceAllow=/dev/tee5 rw
DeviceAllow=/dev/tee6 rw
DeviceAllow=/dev/tee7 rw
DeviceAllow=/dev/tee8 rw
DeviceAllow=/dev/tee9 rw
DeviceAllow=/dev/tee10 rw
DeviceAllow=/dev/tee11 rw
DeviceAllow=/dev/tee12 rw
DeviceAllow=/dev/tee13 rw
DeviceAllow=/dev/tee14 rw
DeviceAllow=/dev/tee15 rw
# Stock fprintd already allows AF_UNIX, reads /var/lib/qsee-supplicant and
# writes its StateDirectory=fprint. The broker socket requires no write mount.
