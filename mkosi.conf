[Config]
MinimumVersion=26

[Distribution]
Distribution=fedora
Release=rawhide

[Output]
Format=directory
ImageId=pocketfed
# Without this, mkosi.output/ is used only when it already exists.
OutputDirectory=mkosi.output
ManifestFormat=json
SplitArtifacts=

[Content]
Bootable=no
# Auto mode does not relabel directory output.
SELinuxRelabel=yes
SourceDateEpoch=0

# Machine configuration and writable state belong to the installed system.
RemoveFiles=
    /etc/fstab
    /etc/locale.conf
    /etc/vconsole.conf
    /boot/*
    /run/*
    /var/*
    # mkosi v26's DNF installroot leaves its lock state under this prefix.
    /buildroot

# Select Fedora @core userspace and @standard utilities, not whole groups.
# @core defaults include dracut-config-rescue, plymouth, and kmscon.
# @standard requires fprintd-pam and, on x86_64, CPU microcode packages.
# Rescue images, display setup, biometrics, and hardware payloads belong in profiles.
Packages=
    authselect
    bash
    bash-completion
    bootc
    btrfs-progs
    bzip2
    container-selinux
    coreutils
    cracklib-dicts
    cryptsetup
    curl
    diffutils
    dnf5
    dnf5-plugins
    dracut
    e2fsprogs
    file
    glibc-langpack-en
    gzip
    hostname
    iproute
    iputils
    jq
    kmod
    less
    NetworkManager
    NetworkManager-config-connectivity-fedora
    NetworkManager-wifi
    nss-altfiles
    openssh-clients
    openssh-server
    ostree
    passwd
    policycoreutils
    polkit
    procps-ng
    rpm-ostree
    rsync
    selinux-policy-targeted
    shadow-utils
    sudo
    systemd
    systemd-pam
    systemd-resolved
    systemd-udev
    tar
    tzdata
    unzip
    util-linux
    vim-minimal
    which
    xz
    zip
    zram-generator-defaults
    zstd

[Build]
Incremental=yes
# Keep both caches in this checkout, including on the first build.
CacheDirectory=mkosi.cache
PackageCacheDirectory=mkosi.pkgcache
ToolsTree=yes
ToolsTreeDistribution=fedora
ToolsTreeRelease=rawhide
# Post-output checks read mkosi's JSON configuration.
ToolsTreePackages=jq
