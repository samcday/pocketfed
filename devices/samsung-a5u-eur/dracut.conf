# Keep the A5U initramfs device-bound. The force-driver list is generated from
# the checked-in MSM8916 candidate inventory after the pinned kernel is
# installed, so unavailable optional suppliers cannot leak build-host choices
# into the archive while the complete eMMC root chain remains mandatory.
add_dracutmodules+=" ostree "
filesystems+=" ext4 "
omit_dracutmodules+=" drm qemu nvdimm fido2 pkcs11 lunmask resume "
