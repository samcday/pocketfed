# Sargo's primary TDM backends are fixed to 16-bit slots. The generic ALSA
# probe advertises S24_32LE first, which misframes built-in speaker playback
# and microphone capture when PipeWire selects it. Constrain only those two
# primary PCMs; the separate headset paths are not on these backends.
monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.card_name = "Google Pixel 3a"
        api.alsa.pcm.stream = "playback"
        api.alsa.path = "hw:G3a,0"
      }
      {
        alsa.card_name = "Google Pixel 3a"
        api.alsa.pcm.stream = "capture"
        api.alsa.path = "hw:G3a,3"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
