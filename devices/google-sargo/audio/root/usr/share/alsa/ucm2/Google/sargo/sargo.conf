Syntax 6

#
# Macro CtlRemapMonoToStereoVolSw - join two mono controls into one stereo
#
# Arguments:
#   Type - Volume or Switch
#   Stereo - Name of the stereo control to be created
#   MonoL - Name of the mono control to be used as Left channel
#   MonoR - Name of the mono control to be used as Right channel
#
DefineMacro.CtlRemapMonoToStereoVolSw {
	LibraryConfig.remap.Config {
		ctl.default.map."name='${var:__Stereo} ${var:__Type}'" {
			"name='${var:__MonoL} ${var:__Type}'".vindex.0 0
			"name='${var:__MonoR} ${var:__Type}'".vindex.1 0
		}
	}
}

Macro.spkrvolremap.CtlRemapMonoToStereoVolSw {
	Type Volume
	Stereo "Digital PCM"
	MonoL "Top Digital PCM"
	MonoR "Bottom Digital PCM"
}

Macro.spkrmuteremap.CtlRemapMonoToStereoVolSw {
	Type Switch
	Stereo "AMP Enable"
	MonoL "Top AMP Enable"
	MonoR "Bottom AMP Enable"
}

Macro.hphvolremap.CtlRemapMonoToStereoVolSw {
	Type Volume
	Stereo "Digital RX Digital"
	MonoL "Digital RX1 Digital"
	MonoR "Digital RX2 Digital"
}

Macro.hphmuteremap.CtlRemapMonoToStereoVolSw {
	Type Switch
	Stereo "Digital RX Mute"
	MonoL "Digital RX1 Mute"
	MonoR "Digital RX2 Mute"
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

SectionUseCase."Voice Call" {
	File "/Google/sargo/VoiceCall.conf"
	Comment "Voice calls"
}

# Volume defaults should be declared in the boot sequence so they can be
# overriden by the user.
BootSequence [
	# Earpiece and Speaker
	cset "name='Top Analog PCM Volume' 17"
	cset "name='Bottom Analog PCM Volume' 17"

	# Headphones
	cset "name='Digital RX1 Digital Volume' 84"
	cset "name='Digital RX2 Digital Volume' 84"

	# Headset Microphone
	cset "name='Analog ADC2 Volume' 8"

	# Built-in Microphone
	cset "name='ADC1 Capture Volume' 45"
	cset "name='ADC2 Capture Volume' 45"
]

FixedBootSequence [
	cset "name='Top Amp Gain Zero-Cross Switch' 1"
	cset "name='Bottom Amp Gain Zero-Cross Switch' 1"

	cset "name='Top PDM LDM Enter Ramp Switch' 1"
	cset "name='Bottom PDM LDM Enter Ramp Switch' 1"

	cset "name='Top PDM LDM Exit Ramp Switch' 1"
	cset "name='Bottom PDM LDM Exit Ramp Switch' 1"

	cset "name='Top LDM Select Switch' 1"
	cset "name='Bottom LDM Select Switch' 1"

	cset "name='Top Channel Mux' RX1"
	cset "name='Bottom Channel Mux' RX2"

	cset "name='Analog RDAC2 MUX' RX2"

	# Built-in Microphone
	cset "name='Stereo1 DMIC Mux' DMIC1"
	cset "name='Stereo2 DMIC Mux' DMIC1"
]
