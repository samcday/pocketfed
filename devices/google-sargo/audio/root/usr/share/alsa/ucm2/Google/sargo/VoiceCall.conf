SectionVerb {
	EnableSequence [
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer LPI_MI2S_TX_3' 1"
		cset "name='MultiMedia4 Mixer PRIMARY_TDM_TX_0' 1"
	]

	DisableSequence [
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='LPI_MI2S_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer LPI_MI2S_TX_3' 0"
		cset "name='MultiMedia4 Mixer PRIMARY_TDM_TX_0' 0"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Internal earpiece"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		# ACDB file: Handset_cal.acdb
		# ACDB device ID: 7
		# ACDB device name: HANDSET_SPKR
		cset "name='VoiceMMode1 RX Topology' 268504967"

		cset "name='SEC_TDM_RX_0 Voice Mixer VoiceMMode1' 1"
		cset "name='Top AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='SEC_TDM_RX_0 Voice Mixer VoiceMMode1' 0"
		cset "name='Top AMP Enable Switch' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 500
		PlaybackChannels 2
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		# ACDB file: Handset_cal.acdb
		# ACDB device ID: 7
		# ACDB device name: HANDSET_SPKR
		cset "name='VoiceMMode1 RX Topology' 268504967"

		cset "name='SEC_TDM_RX_0 Voice Mixer VoiceMMode1' 1"
		cset "name='Bottom AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='SEC_TDM_RX_0 Voice Mixer VoiceMMode1' 0"
		cset "name='Bottom AMP Enable Switch' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 300
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphones (3.5 mm jack)"

	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]

	EnableSequence [
		# ACDB file: Headset_cal.acdb
		# ACDB device ID: 10
		# ACDB device name: HEADSET_SPKR_STEREO
		cset "name='VoiceMMode1 RX Topology' 268504967"

		# There are codecs on other ports for the Pixel 3a. Configure
		# the VoiceMMode1 port in the device enable sequence so this
		# can be switched to in case another device is added.
		cset "name='LPI_MI2S_RX_0 Voice Mixer VoiceMMode1' 1"

		cset "name='Digital RX1 MIX1 INP1' RX1"
		cset "name='Digital RX2 MIX1 INP1' RX2"
		cset "name='Analog HPHL' Switch"
		cset "name='Analog HPHR' Switch"
	]

	DisableSequence [
		cset "name='LPI_MI2S_RX_0 Voice Mixer VoiceMMode1' 0"

		cset "name='Digital RX1 MIX1 INP1' ZERO"
		cset "name='Digital RX2 MIX1 INP1' ZERO"
		cset "name='Analog HPHL' ZERO"
		cset "name='Analog HPHR' ZERO"
	]

	Value {
		PlaybackPCM "hw:${CardId},1"
		PlaybackPriority 500
		PlaybackChannels 2
		JackControl "Headphone Jack"

		# PlaybackMixerElem "Digital RX Digital"
		# PlaybackMixer "default:${CardId}"
		# PlaybackVolume "Digital RX Digital Volume"
		# PlaybackSwitch "Digital RX Mute Switch"
	}
}

SectionDevice."Headset Mic" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Microphone"
	]

	EnableSequence [
		# ACDB file: Headset_cal.acdb
		# ACDB device ID: 8
		# ACDB device name: HEADSET_MIC
		cset "name='VoiceMMode1 TX Topology' 268500987"

		cset "name='VoiceMMode1 Capture Mixer LPI_MI2S_TX_3' 1"

		cset "name='Digital CIC1 MUX' AMIC"
		cset "name='Digital DEC1 MUX' ADC2"
		cset "name='Analog ADC2 MUX' INP2"
	]

	DisableSequence [
		cset "name='VoiceMMode1 Capture Mixer LPI_MI2S_TX_3' 0"

		cset "name='Digital DEC1 MUX' ZERO"
		cset "name='Analog ADC2 MUX' ZERO"
	]
	Value {
		CapturePCM "hw:${CardId},2"
		CapturePriority 500
		CaptureChannels 1
		CaptureVolume "Analog ADC2 Volume"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Microphone" {
	Comment "Built-in Microphone"

	ConflictingDevice [
		"Headset Mic"
	]

	EnableSequence [
		# ACDB file: Handset_cal.acdb
		# ACDB device ID: 41
		# ACDB device name: HANDSET_MIC_ENDFIRE_FLUENCEV5
		cset "name='VoiceMMode1 TX Topology' 268500988"
		cset "name='VoiceMMode1 Capture Mixer PRIMARY_TDM_TX_0' 1"

		cset "name='Sto1 ADC MIXL DMIC Switch' 1"
		cset "name='Sto2 ADC MIXL DMIC Switch' 1"
	]

	DisableSequence [
		cset "name='VoiceMMode1 Capture Mixer PRIMARY_TDM_TX_0' 0"

		cset "name='Sto1 ADC MIXL DMIC Switch' 0"
		cset "name='Sto2 ADC MIXL DMIC Switch' 0"
	]

	Value {
		CapturePCM "hw:${CardId},3"
		CapturePriority 200
		CaptureChannels 1
		CaptureVolume "ADC1 Capture Volume"
	}
}
