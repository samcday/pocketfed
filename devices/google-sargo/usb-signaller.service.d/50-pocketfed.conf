[Service]
# Upstream's unit has no restart policy, and usb-signaller exits when no UDC
# exists yet at startup. 5s keeps retries well inside the default start limit.
Restart=on-failure
RestartSec=5s
# usb-signaller owns the USB gadget, which carries the developer link and, on a
# liveboot, the root filesystem. Keep it away from the OOM killer.
OOMScoreAdjust=-900
# No ExecStop=: the old fork unit switched to charging_only on stop, which
# deletes the gadget from under a USB-served session or root filesystem.
